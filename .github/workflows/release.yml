name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build portable application
        shell: pwsh
        run: ./publish-portable.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' -OutputDirectory '${{ runner.temp }}/m3nuxa' -NoStop -NoLaunch
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path '${{ runner.temp }}/m3nuxa/*' -DestinationPath 'm3nuxa-${{ github.ref_name }}-${{ matrix.runtime }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: m3nuxa-${{ matrix.runtime }}
          path: m3nuxa-${{ github.ref_name }}-${{ matrix.runtime }}.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m3nuxa-*
          merge-multiple: true
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" artifacts/*.zip "${args[@]}"
